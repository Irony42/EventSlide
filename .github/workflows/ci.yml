name: CI

on:
  # A push runs the suite on `main` only. A work branch is tested through its pull request: with
  # every branch here too, each commit on an open pull request ran the whole suite twice, in two
  # concurrency groups (`refs/heads/…` and `refs/pull/…`) that cannot cancel each other, and the
  # two runs queued against the same runners. A branch with no pull request yet can still be run
  # by hand from the Actions tab.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  # A newer push to a pull request supersedes the older one. A push to `main` never does: nine of
  # the last thirty main runs were cancelled by the next merge, so those commits were never
  # verified end to end and "main is green" was only true of the last one. A push to `main` gets its own
  # group (its SHA), because a shared group keeps only one pending run and would still drop the
  # middle one of three quick merges.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Deterministic secrets so the suites behave identically on every runner. These are
  # test values; production secrets come from the deployment environment.
  SESSION_SECRET: ci-session-secret-at-least-32-characters-long
  GUEST_TOKEN_SECRET: ci-guest-token-secret-at-least-32-characters
  E2E_HOOKS: '1'

jobs:
  quality:
    name: Lint, typecheck, unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Retried once on purpose. `ffmpeg-static` and `ffprobe-static` fetch a ~220 MB
        # binary from a third-party host during `npm ci`, outside the npm registry and
        # outside the `cache: npm` above, so a bad minute on that host fails a job that
        # has nothing to do with video — a documentation-only pull request went red on
        # exactly this. A second attempt costs seconds when the first one worked and
        # saves a re-run when it did not; it does not paper over a real install failure,
        # because a genuinely broken lockfile fails both times.
        run: npm ci || npm ci

      - name: Lint
        # Also enforces the architecture boundaries: a domain file importing Express
        # fails here rather than in review.
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # No --passWithNoTests. 1.0's CI was green with zero test files; an empty suite
      # must fail this job.
      - name: Tests with coverage gates
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # The same file ran above with no `dist/` and skipped its block over the real build. With
      # the build present, and `REQUIRE_BUILT_ASSETS` making a skip a failure, it asserts that
      # every hashed asset Vite emitted is promoted to immutable caching.
      - name: Cache rule against the real build
        env:
          REQUIRE_BUILT_ASSETS: '1'
        run: npx vitest run src/interface/http/clientCache.test.ts --project server

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  image:
    # The container is the install story, and none of the six test rings can reach it:
    # `npm run test:coverage` is green on a tree whose image has no ffmpeg in it, ships
    # ninety megabytes of devDependencies, or runs as root. Those are promises about the
    # artefact rather than about the code, so they get a job rather than a seventh ring.
    #
    # scripts/verify-image.sh holds every assertion and is the same command an operator
    # or a maintainer runs locally — the job is deliberately a one-liner so that what CI
    # checks and what a person can check cannot drift apart.
    name: Container image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      # The image build runs `npm ci` and `npm run build` inside itself; nothing here
      # needs Node on the runner.
      #
      # Invoked as `bash <script>` rather than `./<script>` on purpose: this repository
      # is developed on Windows, where the filesystem has no executable bit for git to
      # record, so a checkout can arrive at mode 100644 and `./` would be a permission
      # error that has nothing to do with the image.
      - name: Build the image and check what it promises
        run: bash ./scripts/verify-image.sh

  e2e-shard:
    # One runner per (project, shard). The required checks keep their old names, `End-to-end
    # (<project>)`, and are the `e2e` job below: it waits for every shard of its project and
    # fails unless all of them passed, so branch protection still gates on the same names.
    #
    # Why shards: the heavy projects ran ~210 tests through two workers on one runner, and a
    # browser that shares its runner with another is where the timing flakes came from (a
    # WebKit page stops producing frames under load, see playwright.config.ts). Three or four
    # shards put a third to a quarter of the suite on each runner. `--shard` splits by test
    # (`fullyParallel`), deterministically for a given selection, so the shards of a project
    # partition its tests: no test twice, none dropped.
    name: End-to-end shard (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    # A job that hangs is held for GitHub's default 360 minutes and blocks the pull request
    # all that time. On 2026-10-23 four end-to-end jobs sat for 20 to 50 minutes downloading a
    # browser and its system packages; the Playwright container below holds both, so what is left
    # to wait on is the image pull and a run of about ten minutes, and the bound stays as a net.
    timeout-minutes: 55
    needs: quality
    # The official Playwright image of the exact @playwright/test version in package-lock.json
    # (scripts/ciContainer.test.ts holds the two together): the browsers, their system packages and
    # the fonts are in it, so the runner no longer decides them and no step installs them. `HOME` is
    # `/root` as the Playwright docs ask for a container on GitHub (Actions points it at
    # /github/home, where Firefox refuses to start as root); `--ipc=host` is Chromium's shared-memory
    # advice. docs/TESTING.md §9.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        # `shards` per project is the number of runners it is split over; `e2e` below carries
        # the same numbers and checks it heard from every one, so change both together.
        # Counts measured with `playwright test --list`: chromium-desktop, chromium-mobile and
        # webkit-mobile select 209 tests each (3, 3 and 4 shards: about 70, 70 and 52 per runner);
        # firefox-desktop is `grep: /@smoke/` in playwright.config.ts (19 tests), so it runs a few
        # specs rather than the full journey set — the comment there promises "cross-browser
        # confidence without tripling every run" and this matrix is where that promise is either
        # kept or empty. It was empty once: the project existed and no job ever selected it.
        # chromium-offline runs tests/e2e/offline/ (4 tests) and is the only project that does:
        # every other one carries testIgnore for it. Left out of this matrix it would be a project
        # nothing ever selected, which is the exact failure the firefox-desktop note describes.
        # chromium-client-members runs tests/e2e/security/tenant-isolation.spec.ts alone, on a
        # server started with EVENT_CREATION=clientMembers and SITE_ADMIN=on — roadmap §10.9: tenant
        # isolation holds under both creation policies. The other projects run the same file under
        # the default, anyAccount, so between them the spec runs under both.
        # perf is tests/e2e/perf/ (the frame-rate check, roadmap 11.3), one worker on a runner of
        # its own: a frame rate read while other browsers render beside it is a number about them.
        # It is a gate like the others.
        # `workers` is the Playwright worker count of that job. webkit-mobile gets one per runner
        # because WebKit is the engine that starves under load (a page that stops painting for
        # seconds, measured at twelve workers, see playwright.config.ts); its four shards leave
        # each worker about 52 tests instead of the 105 two workers had, so the job is not slower.
        include:
          - { project: chromium-desktop, shard: 1, shards: 3, workers: 2 }
          - { project: chromium-desktop, shard: 2, shards: 3, workers: 2 }
          - { project: chromium-desktop, shard: 3, shards: 3, workers: 2 }
          - { project: chromium-mobile, shard: 1, shards: 3, workers: 2 }
          - { project: chromium-mobile, shard: 2, shards: 3, workers: 2 }
          - { project: chromium-mobile, shard: 3, shards: 3, workers: 2 }
          - { project: webkit-mobile, shard: 1, shards: 4, workers: 1 }
          - { project: webkit-mobile, shard: 2, shards: 4, workers: 1 }
          - { project: webkit-mobile, shard: 3, shards: 4, workers: 1 }
          - { project: webkit-mobile, shard: 4, shards: 4, workers: 1 }
          - { project: firefox-desktop, shard: 1, shards: 1, workers: 2 }
          - { project: chromium-offline, shard: 1, shards: 1, workers: 2 }
          - { project: chromium-client-members, shard: 1, shards: 1, workers: 2 }
          - { project: perf, shard: 1, shards: 1, workers: 1 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Retried once on purpose. `ffmpeg-static` and `ffprobe-static` fetch a ~220 MB
        # binary from a third-party host during `npm ci`, outside the npm registry and
        # outside the `cache: npm` above, so a bad minute on that host fails a job that
        # has nothing to do with video — a documentation-only pull request went red on
        # exactly this. A second attempt costs seconds when the first one worked and
        # saves a re-run when it did not; it does not paper over a real install failure,
        # because a genuinely broken lockfile fails both times.
        run: npm ci || npm ci

      - name: Build
        run: npm run build

      - name: Run journeys
        # Bounds a hung journey (the #320 failure mode): Playwright's own `globalTimeout` (40 min,
        # playwright.config.ts) stops the run and writes the report; this step bound is the net
        # under it, and ends the step as *failed*, not as the job's cancellation. The slowest
        # healthy job takes 18 minutes.
        timeout-minutes: 45
        # `--workers` comes from the matrix (a project's own `workers` in the config still caps
        # it: perf is one). The reporters in playwright.config.ts run per shard, failOnFlaky
        # among them: a test that passed only on a retry fails the shard it ran in.
        run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --workers=${{ matrix.workers }}

      - name: Flake rate of this shard
        # Whatever the outcome of the run, as long as it wrote a report: the table lands in the
        # job summary and says which tests of this shard failed or only passed on a retry.
        if: always() && hashFiles('playwright-json/report.json') != ''
        run: npx tsx scripts/flakeRate.ts --summary "$GITHUB_STEP_SUMMARY" playwright-json/report.json

      - name: Upload the JSON report
        # Kept 30 days (the HTML report below only on failure, for 7): this is the history the
        # flake rate is read from. Sum any number of them with `npx tsx scripts/flakeRate.ts`
        # after `gh run download --pattern 'playwright-json-*'`; docs/TESTING.md §9.
        if: always() && hashFiles('playwright-json/report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-json-${{ matrix.project }}-${{ matrix.shard }}of${{ matrix.shards }}
          path: playwright-json/report.json
          retention-days: 30

      - name: Upload report
        # `cancelled()` too: a job cancelled by the job-level bound or by hand still keeps its
        # trace, which is the one thing a hang leaves worth reading.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}of${{ matrix.shards }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    # The required status checks. Branch protection names `End-to-end (<project>)` for five
    # projects; the work now happens in `e2e-shard`, so this job keeps those names and answers
    # for all the shards of its project: green only when every one of the `shards` expected jobs
    # exists and succeeded.
    #
    # `if: always()` and an explicit failure, never a skip: a skipped required check counts as
    # passing, so when `quality` fails (and every shard is skipped) a skipped gate would let the
    # merge through on the strength of nothing having run. The shard jobs are found by name through
    # the API because `needs.e2e-shard.result` is one verdict for the whole matrix, and a red
    # chromium-mobile shard must not turn the chromium-desktop check red.
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    timeout-minutes: 5
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium-desktop, shards: 3 }
          - { project: chromium-mobile, shards: 3 }
          - { project: webkit-mobile, shards: 4 }
          - { project: firefox-desktop, shards: 1 }
          - { project: chromium-offline, shards: 1 }
          - { project: chromium-client-members, shards: 1 }
          - { project: perf, shards: 1 }
    steps:
      - name: Every shard of the project passed
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ matrix.project }}
          EXPECTED: ${{ matrix.shards }}
        run: |
          conclusions="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("End-to-end shard (" + env.PROJECT + " ")) | "\(.name): \(.conclusion)"')"
          echo "$conclusions"
          found="$(printf '%s\n' "$conclusions" | grep -c . || true)"
          passed="$(printf '%s\n' "$conclusions" | grep -c ': success$' || true)"
          if [ "$found" -ne "$EXPECTED" ] || [ "$passed" -ne "$EXPECTED" ]; then
            echo "::error::$PROJECT: expected $EXPECTED passing shard(s), found $found job(s) of which $passed passed."
            exit 1
          fi

  quarantine:
    # The tests tagged `@quarantine` (policy: docs/TESTING.md §9), run on each project they belong
    # to and never blocking: `continue-on-error`, and no required check or other job names it. They
    # are out of the gate (playwright.config.ts excludes the tag unless E2E_QUARANTINE=only) but they
    # must keep running, because a quarantined test that stops producing results can never be shown
    # to have been fixed. Retries stay at the CI default so a pass-on-retry reads as "flaky" and an
    # outright failure as "failed" in the JSON report that scripts/flakeRate.ts summarises.
    #
    # One runner, projects in turn: the list is usually empty or a handful of tests, and a runner
    # per project would spend more minutes installing browsers than running them. `--list` is how it
    # knows which projects have any (it needs no browser and no build), so an empty quarantine costs
    # an `npm ci` and a note in the summary.
    name: Quarantined end-to-end tests (non-blocking)
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true
    timeout-minutes: 45
    # The same image and settings as the shards (see e2e-shard), so a quarantined test fails for
    # the reason it failed in the gate, not because it runs on a different machine.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      E2E_QUARANTINE: only
      HOME: /root
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci || npm ci

      - name: Which projects have a quarantined test
        id: plan
        run: |
          # `|| true`: a selection with no test makes `--list` exit 1, and an empty one is the
          # normal case. A list that is not JSON still fails the step in `node` below.
          npx playwright test --list --grep-invert @visual --reporter=json > quarantine-list.json || true
          projects="$(node -e '
            const report = JSON.parse(require("fs").readFileSync("quarantine-list.json", "utf8"))
            const found = new Set()
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) for (const test of spec.tests) found.add(test.projectName)
              for (const child of suite.suites ?? []) walk(child)
            }
            for (const suite of report.suites) walk(suite)
            console.log([...found].sort().join(" "))
          ')"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          if [ -z "$projects" ]; then
            echo "### Quarantined end-to-end tests" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No test is tagged \`@quarantine\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "quarantined on: $projects"
          fi

      - name: Build
        if: steps.plan.outputs.projects != ''
        run: npm run build

      - name: Run the quarantined tests
        if: steps.plan.outputs.projects != ''
        env:
          PROJECTS: ${{ steps.plan.outputs.projects }}
        run: |
          mkdir -p playwright-json/quarantine
          status=0
          for project in $PROJECTS; do
            # The browsers are in the image. A project's own `workers` in the config still caps this: perf is one.
            npm run test:e2e -- --project="$project" --workers=1 || status=1
            mv playwright-json/report.json "playwright-json/quarantine/$project.json" || true
          done
          exit $status

      - name: Flake rate of the quarantined tests
        if: always() && hashFiles('playwright-json/quarantine/*.json') != ''
        run: npx tsx scripts/flakeRate.ts --all --summary "$GITHUB_STEP_SUMMARY" playwright-json/quarantine/*.json

      - name: Upload the quarantine reports
        # Kept 30 days, so the history that decides whether a test leaves quarantine can be read
        # back with `gh run download` and summed by scripts/flakeRate.ts.
        if: always() && hashFiles('playwright-json/quarantine/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-json-quarantine
          path: playwright-json/quarantine/
          retention-days: 30

  repeat-changed-specs:
    # A pull request that adds or changes an end-to-end spec runs that spec five times with no
    # retry. The shards run each test once, and retry it twice: a journey that fails one run in
    # five passes the gate three times out of four and then becomes tomorrow's flake. Here the
    # same failure is a red job on the pull request that introduced it.
    #
    # Not a required check, on purpose, and named so that nobody mistakes it for one: it is
    # evidence for the reviewer. It runs on `chromium-desktop` and `webkit-mobile`, the two
    # engines the flakes have come from, and on `chromium-offline` for a changed offline spec
    # (the only project that selects it). The frame-rate specs (`perf`) and the `@visual` ones
    # are left to their own jobs (scripts/changedSpecs.ts); a quarantined test is excluded by the
    # config like everywhere else, and a changed spec with nothing left to run passes.
    #
    # The decision whether there is anything to repeat is taken before `npm ci` and before a
    # browser is downloaded, so a pull request that touches no spec costs three short jobs.
    name: Repeat changed specs (${{ matrix.project }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    # The image of the shards, for the same reason. `git` is in it, which the full-history checkout
    # and the diff against the base branch need.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium-desktop, workers: 2 }
          - { project: webkit-mobile, workers: 1 }
          - { project: chromium-offline, workers: 1 }
    steps:
      - uses: actions/checkout@v7
        with:
          # The base branch has to be there to diff against.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Which specs changed
        id: select
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECT: ${{ matrix.project }}
        run: |
          # Three dots: the changes of the pull request since it left its base, not the base's own.
          # The base is the pull request's own (a stacked pull request diffs against its parent).
          git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...$HEAD_SHA" -- tests/e2e > changed.txt
          node scripts/changedSpecs.ts --project "$PROJECT" < changed.txt > specs.txt
          if [ -s specs.txt ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Repeating on $PROJECT:"
            cat specs.txt
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changed spec for $PROJECT, nothing to repeat."
            echo "No changed end-to-end spec for \`$PROJECT\`, nothing to repeat." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        if: steps.select.outputs.run == 'true'
        run: npm ci || npm ci

      - name: Build
        if: steps.select.outputs.run == 'true'
        run: npm run build

      - name: Run the changed specs five times each
        if: steps.select.outputs.run == 'true'
        timeout-minutes: 30
        # `--retries=0`: one failure in five is the finding, a retry would hide it.
        # `--pass-with-no-tests`: every test of a changed spec may be quarantined.
        run: |
          mapfile -t specs < specs.txt
          npm run test:e2e -- --project=${{ matrix.project }} --workers=${{ matrix.workers }} --repeat-each=5 --retries=0 --pass-with-no-tests "${specs[@]}"

      - name: Flake rate of the repeated specs
        if: always() && steps.select.outputs.run == 'true' && hashFiles('playwright-json/report.json') != ''
        run: npx tsx scripts/flakeRate.ts --summary "$GITHUB_STEP_SUMMARY" playwright-json/report.json

      - name: Upload report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-repeat-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    # The four baselines under tests/e2e/__screenshots__/ are the only assertion in the
    # repository that the projected wall still *looks* right, and until now no job
    # compared them: `npm run test:e2e` is `--grep-invert @visual`, and nothing ran
    # `test:e2e:visual`. Three commits on this branch fixed snapshots that had been
    # photographing the wrong thing, every one of them caught by hand.
    #
    # They were excluded for a real reason, not laziness. A baseline image is
    # platform-specific — font rasterisation on the Windows workstation that generated
    # these is not font rasterisation on an Ubuntu runner — and Playwright fails on a
    # missing snapshot. Pointing a Linux job at the committed images would therefore be
    # red on every pull request forever, regression or not, and a permanently-red job is
    # a job people stop reading. That must not come back.
    #
    # So this job never compares against the committed images. It renders its own
    # "before" from the pull request's merge base, on this runner, in this run, then
    # renders the "after" from the head and compares the two. Both sides share one
    # Chromium build, one font stack and one machine, so the only thing a diff can mean
    # is that this pull request changed how the wall looks. Platform drift cannot make
    # it red, and no baseline is ever missing because this job just made it.
    #
    # The committed images keep their job unchanged: they are the local loop, for
    # `npm run test:e2e:visual` on the machine that generated them. See docs/TESTING.md.
    name: Visual regression (wall)
    # Only on a pull request, because the method is "compare against what you changed"
    # and a plain branch push has no before. Absent is the right answer there — better
    # than present and asserting nothing, which is the failure this job exists to undo.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: quality
    # In the Playwright image too: both renders happen in this one job, so they share its fonts
    # whichever image carries them, and the committed baselines are never compared here (see
    # above), so the image changing the rasterisation cannot invalidate them. What the container
    # adds is that the fonts of the runner stop being a variable between two runs of the job.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
        with:
          # Both sides of the comparison have to be checked out in turn.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve the two commits to render
        run: |
          base="$(git merge-base '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}')"
          {
            echo "BASE_SHA=$base"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          } >> "$GITHUB_ENV"
          echo "before: $base"
          echo "after:  ${{ github.event.pull_request.head.sha }}"

      # The whole method is "render the before, render the after, compare". That needs a
      # before that can render — and the merge base of the 2.0 rewrite is a 1.0 commit
      # with no Playwright suite and no `test:e2e:update-snapshots` script at all, so the
      # job failed on `npm error Missing script` rather than on anything about the wall.
      #
      # Every later pull request has a base that carries both, so this is a guard for the
      # first one rather than a permanent escape hatch. It reports loudly and skips,
      # because the alternative — comparing the head against committed images rendered on
      # a different operating system — is the permanently-red job this whole design
      # exists to avoid.
      - name: Can the merge base render a before?
        run: |
          if git cat-file -e "$BASE_SHA:package.json" 2>/dev/null &&
             git show "$BASE_SHA:package.json" | grep -q '"test:e2e:update-snapshots"'; then
            echo "COMPARABLE=1" >> "$GITHUB_ENV"
          else
            echo "COMPARABLE=0" >> "$GITHUB_ENV"
            # One line: a workflow command with a newline in it is printed as plain text
            # and never becomes an annotation.
            echo "::warning::The merge base $BASE_SHA has no visual suite, so there is no before to compare against and this job is skipping. Expected for the first pull request of the 2.0 rewrite and for nothing else — on a later one it means the base is wrong or the script was renamed."
          fi

      # ------------------------------------------------------------------ before --
      - name: Check out the merge base
        if: env.COMPARABLE == '1'
        run: git checkout --force --detach "$BASE_SHA"

      - name: Install dependencies
        # Retried once on purpose. `ffmpeg-static` and `ffprobe-static` fetch a ~220 MB
        # binary from a third-party host during `npm ci`, outside the npm registry and
        # outside the `cache: npm` above, so a bad minute on that host fails a job that
        # has nothing to do with video — a documentation-only pull request went red on
        # exactly this. A second attempt costs seconds when the first one worked and
        # saves a re-run when it did not; it does not paper over a real install failure,
        # because a genuinely broken lockfile fails both times.
        run: npm ci || npm ci
        if: env.COMPARABLE == '1'

      - name: Browser of this checkout (merge base)
        if: env.COMPARABLE == '1'
        timeout-minutes: 15
        # The image carries the browser of the Playwright version this workflow names. The merge base
        # can sit on another version (a pull request cut before a Playwright bump), and its render
        # would then fail on a missing executable rather than on anything about the wall. A no-op
        # when the revision is already there, a download of Chromium alone when it is not.
        run: timeout 6m npx playwright install chromium || timeout 6m npx playwright install chromium

      - name: Build
        if: env.COMPARABLE == '1'
        run: npm run build

      - name: Render the baselines from the merge base
        if: env.COMPARABLE == '1'
        # The committed images are deleted first so that every snapshot is *missing* and
        # gets written fresh, rather than left in place by whichever update mode the
        # installed Playwright defaults to. With an explicit `--update-snapshots` this
        # exits 0 even on a runner with CI set — verified against Playwright 1.63.0,
        # which is the version this repository pins.
        run: |
          rm -rf tests/e2e/__screenshots__
          npm run test:e2e:update-snapshots

      - name: Check the before is complete, and keep it out of the next checkout's way
        if: env.COMPARABLE == '1'
        run: |
          shots='tests/e2e/__screenshots__'
          # Counted for the one project the visual suite runs, not across the whole
          # tree. `test:e2e:visual` pins --project=chromium-desktop, so a baseline
          # committed for any other project can never be rendered here — and comparing
          # against it reports a broken harness on a pull request that broke nothing.
          # Not hypothetical: four chromium-mobile baselines reached main from a local
          # run, and the next pull request failed this step because of them.
          project="$shots/chromium-desktop"
          rendered="$(find "$project" -type f -name '*.png' 2>/dev/null | wc -l | tr -d '[:space:]')"
          expected="$(git ls-tree -r --name-only "$BASE_SHA" -- "$project" | grep -c '\.png$' || true)"
          echo "rendered $rendered chromium-desktop baseline image(s); the merge base carries $expected"
          if [ "$rendered" -eq 0 ] || [ "$rendered" -lt "$expected" ]; then
            echo "::error::The merge base rendered $rendered of $expected baselines. That is a broken visual harness, not a regression in this pull request — read the step above before touching the wall."
            exit 1
          fi
          mv "$shots" "$RUNNER_TEMP/visual-baseline"

      # ------------------------------------------------------------------- after --
      - name: Check out the pull request head
        if: env.COMPARABLE == '1'
        run: git checkout --force --detach "$HEAD_SHA"

      - name: Install dependencies
        # Retried once on purpose. `ffmpeg-static` and `ffprobe-static` fetch a ~220 MB
        # binary from a third-party host during `npm ci`, outside the npm registry and
        # outside the `cache: npm` above, so a bad minute on that host fails a job that
        # has nothing to do with video — a documentation-only pull request went red on
        # exactly this. A second attempt costs seconds when the first one worked and
        # saves a re-run when it did not; it does not paper over a real install failure,
        # because a genuinely broken lockfile fails both times.
        run: npm ci || npm ci
        if: env.COMPARABLE == '1'

      - name: Browser of this checkout (pull request head)
        if: env.COMPARABLE == '1'
        timeout-minutes: 15
        # The head's own browser: normally the image's, so this is a no-op. Kept so the two renders
        # start from the same guarantee as the merge-base one above.
        run: timeout 6m npx playwright install chromium || timeout 6m npx playwright install chromium

      - name: Build
        if: env.COMPARABLE == '1'
        run: npm run build

      - name: Compare the wall against the merge base
        if: env.COMPARABLE == '1'
        # Two passes, and the first one is not the gate.
        #
        # A visual test *added* by this pull request has no before — the merge base
        # could not have rendered it. Playwright's answer to a missing snapshot is to
        # write it and fail the test anyway, even with `--update-snapshots=missing` and
        # even on CI (checked, Playwright 1.63.0: "A snapshot doesn't exist ... writing
        # actual", 1 failed). Left alone that is a red for doing the right thing, which
        # is how a job stops being read.
        #
        # So pass one writes only the snapshots that are absent — `missing` never
        # rewrites one that exists, so every baseline the merge base rendered survives
        # untouched — and its exit code is deliberately ignored. Pass two is the gate: a
        # plain comparison where a pre-existing baseline still holds the merge base's
        # pixels, so a regression fails, and a newly added test compares against its own
        # first render, so it passes.
        #
        # The hole this could open — every baseline missing, pass two comparing the head
        # against itself and asserting nothing — is the one the count guard above
        # closes. That guard is what makes "missing" mean new rather than lost.
        run: |
          rm -rf tests/e2e/__screenshots__
          cp -R "$RUNNER_TEMP/visual-baseline" tests/e2e/__screenshots__
          npm run test:e2e:visual -- --update-snapshots=missing || true
          npm run test:e2e:visual

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # The diff images live in test-results/; they are the only useful output when
          # this job is red, and reading them is the job.
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  licenseHistory:
    # The relicence guard. `.github/gpl-boundary` holds the SHA of the last commit
    # published under GPL-3.0, and every commit after it on the first-parent chain must
    # carry the canonical AGPL-3.0-only LICENSE.
    #
    # It reads the boundary from that committed file and deliberately not from a
    # `gpl-final` tag: the maintainer pushes that tag himself, later, and a job that
    # needed it could not run until then.
    #
    # It is not a required check; whether to make it one is the maintainer's call.
    name: License history (AGPL boundary)
    runs-on: ubuntu-latest
    steps:
      # Left on actions/checkout's default ref on purpose. On a pull_request that is the
      # merge commit, whose first-parent chain is exactly what main will look like once
      # the pull request lands. A pull request's own commits sit on the second parent
      # there and never appear on main's first-parent chain, so pinning the head instead
      # would check history main never sees, and would turn every branch cut before the
      # relicence red — they predate the boundary file — for a state main will never be in.
      - uses: actions/checkout@v7
        with:
          # `git merge-base --is-ancestor` and `git rev-list <boundary>..HEAD` need the
          # boundary commit, which can be arbitrarily far back. A shallow checkout would
          # fail with an unknown revision rather than a clean pass or fail.
          fetch-depth: 0

      - name: Every commit since the GPL boundary carries the AGPL LICENSE
        run: |
          boundary_file=.github/gpl-boundary
          if [ ! -f "$boundary_file" ]; then
            echo "::error::$boundary_file is missing. It names the last GPL commit, and this job cannot run without it."
            exit 1
          fi
          boundary="$(tr -d '[:space:]' < "$boundary_file")"

          # The git blob SHA-1 of the canonical, unmodified AGPL-3.0 text served by
          # https://www.gnu.org/licenses/agpl-3.0.txt. scripts/licenseMetadata.test.ts pins
          # the same value for LICENSE itself and asserts the two copies agree. GitHub's
          # own licence API serves a variant with one line of the optional appendix
          # wrapped differently (blob 0ad25db4bd1d86c452db3f9602ccdbe172438f52); it is not
          # what this repository ships.
          agpl_blob="be3f7b28e564e7dd05eaf59d64adba1a4065ac0e"

          echo "boundary (last GPL commit): $boundary"
          echo "expected LICENSE blob (AGPL-3.0-only): $agpl_blob"

          if ! git merge-base --is-ancestor "$boundary" HEAD 2>/dev/null; then
            echo "::error::$boundary (from $boundary_file) is not an ancestor of HEAD. Either the boundary is wrong, or the checkout is shallow and fetch-depth: 0 did not run."
            exit 1
          fi

          # --first-parent on purpose: main merges pull requests with merge commits, and a
          # branch cut before the relicence is merged later with its own commits still
          # carrying the old LICENSE. Those sit on a second parent; the merge commit on
          # main's own line is what the relicence governs. The limit of that choice: a
          # commit with a GPL LICENSE brought in through a second parent is not seen here,
          # so keeping the licence out of merged history is a matter of rebasing, not of
          # this job.
          commits="$(git rev-list --first-parent "$boundary"..HEAD)"

          if [ -z "$commits" ]; then
            echo "::error::No commits between the boundary $boundary and HEAD on the first-parent chain, so there is nothing to check. If this is a real branch, the boundary or the checkout ref is wrong."
            exit 1
          fi

          failed=0
          while IFS= read -r sha; do
            blob="$(git rev-parse --verify -q "$sha:LICENSE" || true)"
            if [ -z "$blob" ]; then
              echo "::error::$sha has no LICENSE file at all."
              failed=1
            elif [ "$blob" != "$agpl_blob" ]; then
              echo "::error::$sha carries LICENSE blob $blob, not the AGPL-3.0-only text ($agpl_blob). Either a commit on this chain restored another LICENSE, or main moved past the boundary after it was pinned: those commits really are GPL, and the fix is to set $boundary_file to main's current tip."
              failed=1
            fi
          done <<< "$commits"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          count="$(echo "$commits" | wc -l)"
          echo "All $count first-parent commit(s) since the boundary carry the AGPL-3.0-only LICENSE."
