name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic secrets so the suites behave identically on every runner. These are
  # test values; production secrets come from the deployment environment.
  SESSION_SECRET: ci-session-secret-at-least-32-characters-long
  GUEST_TOKEN_SECRET: ci-guest-token-secret-at-least-32-characters
  E2E_HOOKS: '1'

jobs:
  quality:
    name: Lint, typecheck, unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        # Also enforces the architecture boundaries: a domain file importing Express
        # fails here rather than in review.
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # No --passWithNoTests. 1.0's CI was green with zero test files; an empty suite
      # must fail this job.
      - name: Tests with coverage gates
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-mobile, webkit-mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build

      - name: Run journeys
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
