# EventSlide, self-hosted.
#
#   1. Generate two secrets:
#        node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
#   2. Put them in a `.env` next to this file, along with PUBLIC_URL.
#   3. docker compose up          <- the first time, in the foreground. See below.
#   4. docker compose up -d       <- once it has booted cleanly.
#
# Run it in the foreground once. `restart: unless-stopped` is right for the evening of
# the party and wrong for the first boot: a missing or malformed variable makes the
# server exit 78 with a list of every problem at once, and detached that list scrolls
# past into `docker compose logs` while the container restarts forever. The first run is
# the one where you want to read it.
#
# PUBLIC_URL must be the address a guest's phone can actually reach — a domain, never
# localhost. It is what the QR code encodes, and a QR code pointing at localhost is the
# most common way a setup fails on the night.
#
# **It must be https.** The server speaks plain HTTP and never terminates TLS, so a
# reverse proxy in front of this container is part of the install and not an
# optimisation: NODE_ENV=production refuses a non-localhost http PUBLIC_URL at boot,
# because the host's session cookie is `Secure` and a browser will not send it over
# http — a host who got past that refusal would meet a login form that silently never
# logs in. `ports:` below therefore binds to loopback, and TRUST_PROXY_HOPS says one
# proxy. The two go together; changing either without the other is a misconfiguration.
# See docs/SECURITY.md §11.

services:
  eventslide:
    build: .
    image: eventslide:2.0.0
    restart: unless-stopped
    # Loopback, because the reverse proxy above is the only thing that should reach this
    # port — docs/SECURITY.md §11 says bind to 127.0.0.1 and this is where that happens.
    # Publishing on every interface while TRUST_PROXY_HOPS says `1` is the worst of both:
    # Express then believes an `X-Forwarded-For` that nothing in the deployment wrote, so
    # a guest sends one header and gets a fresh rate-limit bucket per request. The
    # limiter becomes decorative, which is the exact failure §11 names.
    #
    # Set BIND_ADDRESS=0.0.0.0 only if the proxy is on another machine, and then firewall
    # the port. If the proxy is a container on the same Docker network, delete this block
    # entirely and let it reach `eventslide:4300` directly.
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-4300}:4300'
    # Docker's default is 10s and `index.ts` gives in-flight requests 15s before it
    # forces the exit, so the default would SIGKILL the process 5s before its own
    # backstop — the WAL unbrought to a checkpoint and whatever was mid-upload lost.
    # Twenty gives the backstop room to run and still return the prompt promptly.
    stop_grace_period: 20s
    # Every key in `.env` reaches the container through this, not only the handful
    # substituted below. Compose already reads `.env` to fill in `${VAR}` references in
    # this file — that part worked before and still does — but without `env_file` a
    # setting that is not named under `environment:` never reached the process at all:
    # an operator who followed `.env.example` and set, say, MAX_UPLOAD_BYTES or
    # MAX_QUEUED_CLIPS_PER_EVENT edited a file the container never read. `environment:`
    # still wins on the few keys both set, which is why the explicit `${VAR:?...}`
    # refusals below keep working unchanged.
    #
    # `required: false`, deliberately: the short-form `env_file: [.env]` makes the file
    # a hard precondition of `docker compose up` itself — a config-time refusal, before
    # a container even starts, with none of this project's own "name every problem at
    # once" posture. An operator who supplies PUBLIC_URL and the two secrets another
    # way — a real exported shell environment, a systemd `EnvironmentFile=`, a secrets
    # manager — and keeps no `.env` on disk was booting cleanly before this line
    # existed; `required: false` keeps that working, falling back to the `environment:`
    # substitutions alone exactly as before.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL to the address guests will reach, e.g. https://photos.example.com}
      SESSION_SECRET: ${SESSION_SECRET:?generate with node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"}
      GUEST_TOKEN_SECRET: ${GUEST_TOKEN_SECRET:?generate a second, different secret the same way}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Number of reverse proxies in front of this container. Wrong values break
      # per-IP rate limiting: too low and one guest's burst locks out the venue, too
      # high and a client can spoof its address past the limit.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DEFAULT_EVENT_QUOTA_BYTES: ${DEFAULT_EVENT_QUOTA_BYTES:-5000000000}
      # Creates the first owner account on an empty database, then is ignored. There is
      # no default admin password in 2.0.
      #
      # `:-` renders an empty string when you have not set one, and the server reads
      # that as "not set" rather than as a password — which is why leaving both out is
      # the supported way to create the owner from somewhere else. Set both or neither:
      # half of a bootstrap creates nothing and is refused at boot. The password is held
      # to the same policy as any account password, and a weak one stops the boot with a
      # message naming this variable, instead of a log line nobody reads and a login
      # form that will not let you in.
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-}
      # `on` only if this box is run for other people: it mounts the operator's own
      # namespace, /api/site, behind the operator check. `off` — the default, and all a box
      # you run for yourself ever needs — leaves those paths unmounted, answering exactly
      # like any path that does not exist. Exactly `off` or `on`; anything else stops the
      # boot and names this variable. See .env.example.
      SITE_ADMIN: ${SITE_ADMIN:-off}
      # Where the source of **this build** is published — the link AGPL section 13 obliges a
      # network service to offer, shown on every guest and host screen and in
      # `GET /api/about`. Leave it empty when you run an unmodified copy of a tagged
      # release: the link is then the upstream tag of the running version. Set it (an https
      # URL, nothing else) when you run a modified build, a fork, or a build of a commit no
      # tag names. It changes where the link
      # points; nothing hides it. See .env.example.
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:-}
    volumes:
      # The database, every photo, and under /data/backups the archives the backup
      # command writes (BACKUP_DIR, set in the Dockerfile). Everything is here, but do not
      # back it up by copying this path: a copy of a live SQLite file misses whatever is
      # still in its WAL. `docker compose exec eventslide node dist/ops/scripts/backup.js`
      # takes a consistent snapshot, and the README's Backups section covers the rest —
      # taking the archive off this disk, and restoring with the service stopped.
      - eventslide-data:/data
    # A photo wall is not a target worth much, but the container writes only to /data
    # and there is no reason for it to be able to write anywhere else.
    read_only: true
    tmpfs:
      # Nothing stages an upload here, and that is still true of clips.
      #
      # `guestRoutes.ts` uses `multer.memoryStorage()`, so every uploaded photo byte is a
      # Buffer in the heap and never touches a filesystem — deliberately, because 1.0
      # leaked temporary files on the failure paths and the pipeline re-encodes
      # everything anyway. A clip does stream to disk (`clipRoutes.ts`), and ffmpeg needs
      # seekable scratch files on both sides of a transcode because `+faststart` rewrites
      # the index at the end — but both go under **`MEDIA_ROOT`**, on the `/data` volume,
      # never here. A 60 MB clip written to this tmpfs would be 60 MB charged to the same
      # cgroup as the heap, which is the one thing disk storage was chosen to avoid.
      #
      # This mount exists only because `read_only: true` above makes the whole root
      # filesystem read-only, and a Node process with no writable temp directory fails
      # in ways that are hard to read. It is a ceiling, not a reservation: an unused
      # tmpfs costs nothing, and what it does cost is charged to the same cgroup as the
      # heap, so it is not extra headroom on top of the limit below.
      #
      # **The number to size for uploads is `deploy.resources.limits.memory`, not this
      # one**, and the arithmetic is written out beside it.
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # What this number has to cover, in the order it is spent:
          #
          #   150 MB  one request's uploaded bytes. Multipart is buffered in the heap
          #           (`multer.memoryStorage()`), and this is the aggregate bound
          #           `guestRoutes.ts` enforces while the body is read. It is what makes
          #           the figure knowable at all: multer bounds a file and a count but
          #           never the total, so before that bound existed one request could
          #           hold MAX_FILES_PER_UPLOAD x MAX_UPLOAD_BYTES — 20 x 25 MB = 500 MB
          #           against this same limit, and nothing refused it.
          #   ~200 MB sharp decoding one accepted photo into three variants. A bomb is
          #           rejected from the header before it is decoded, but a legitimate
          #           50-megapixel photo still needs the room. The upload stays buffered
          #           while this runs, so the two add rather than replace one another.
          #   ~100 MB Node, SQLite and the rest of the process.
          #   ~150 MB one clip being transcoded. The queue runs at concurrency 1 for
          #           every event on the box, so this is charged once however many are
          #           waiting: the ffmpeg process itself, plus the one buffer of at most
          #           MAX_CLIP_BYTES that the bytes-in/bytes-out port implies. The
          #           uploaded clip is streamed to disk under MEDIA_ROOT, not buffered,
          #           so MAX_CLIP_BYTES does **not** multiply by the requests in flight
          #           the way MAX_UPLOAD_BYTES would.
          #
          # The first two lines are **per request**, and MAX_CONCURRENT_UPLOAD_REQUESTS
          # (G3-06 / P4-10) is what decides how many requests that really means: a slot is
          # held from the moment a guest's upload is admitted until its response is sent,
          # which spans both the buffering and the decode above, not just the buffering.
          # At the default of 4, that is 4 x (150 MB + 200 MB) = 1.4 GB, not 4 x 150 MB —
          # a request past the limit is refused 429 `upload.busy` before it buffers
          # anything, so it costs nothing. 1.4 GB plus the ~100 MB baseline and the clip
          # transcode's ~150 MB (independent of upload concurrency, so it adds rather than
          # multiplies) is where the 2 GB below comes from, with a little headroom rather
          # than none.
          #
          # Raising MAX_FILES_PER_UPLOAD no longer changes the first line. Raising
          # MAX_UPLOAD_BYTES does — the per-request bound is never below one file you
          # declared acceptable — so raise this with it, or leave it alone. Raising
          # MAX_CONCURRENT_UPLOAD_REQUESTS multiplies the 350 MB per-request figure
          # directly, so redo this arithmetic before raising it rather than after.
          memory: 2g

volumes:
  eventslide-data:
